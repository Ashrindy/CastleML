name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: build-windows
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Install MinGW
      uses: egor-tensin/setup-mingw@v3.0
      with:
        platform: any
        cc:
        version:
        
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build --preset mingw-windows-release
      
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: archives
        path: ${{github.workspace}}/build/castle-ml/libcastle-ml.dll
